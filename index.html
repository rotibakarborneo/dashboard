<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roti Bakar Borneo — Dashboard Bos</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <div><p class="eyebrow">ROTI BAKAR BORNEO</p><h1>Dashboard performa outlet</h1><p>Ringkasan penjualan dan operasional seluruh cabang.</p></div>
      <div class="filter"><label>Mulai <input id="startDate" type="date"></label><label>Sampai <input id="endDate" type="date"></label><button id="refreshButton">Perbarui</button></div>
    </header>
    <section class="metrics" aria-label="Ringkasan"><article><span>Roti terjual</span><strong id="totalRoti">—</strong></article><article><span>Setoran</span><strong id="totalSetor">—</strong></article><article><span>Pengeluaran</span><strong id="totalPengeluaran">—</strong></article><article><span>Request bahan</span><strong id="totalRequest">—</strong></article></section>
    <section class="panel chart-panel"><div class="section-heading"><div><p class="eyebrow">PERBANDINGAN CABANG</p><h2>Penjualan roti harian</h2></div><p id="chartHint">Memuat data…</p></div><div class="chart-wrap"><canvas id="salesChart"></canvas></div></section>
    <section class="panel"><div class="section-heading"><div><p class="eyebrow">RINGKASAN OUTLET</p><h2>Performa per cabang</h2></div></div><div class="table-wrap"><table><thead><tr><th>Cabang</th><th>Roti terjual</th><th>Setoran</th><th>Pengeluaran</th><th>Laporan</th><th>Request</th></tr></thead><tbody id="branchTable"></tbody></table></div></section>
    <p id="errorMessage" class="error" hidden></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
